{% extends "admin/base_admin.html" %}
{% block title %}Log In{% endblock %}

{% block guest_content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
        <div class="flex flex-col items-center mb-8">
            <img src="{{ admin_logo_url() }}" alt="OG Multiservices" class="h-12 w-auto mb-3">
            <h1 class="font-bold text-lg text-brand-800">Admin Login</h1>
        </div>
        <form method="POST" class="bg-white border border-slate-100 rounded-2xl p-6 space-y-4 shadow-sm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input type="email" name="email" required autofocus
                       class="w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" name="password" required
                       class="w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent-500">
            </div>
            <button type="submit"
                    class="w-full rounded-lg bg-accent-600 text-white font-semibold py-2.5 hover:bg-accent-700 transition">
                Log In
            </button>
        </form>
    </div>
</div>
{% endblock %}
