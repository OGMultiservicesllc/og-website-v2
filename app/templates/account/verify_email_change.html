{% extends "base.html" %}
{% block title %}{{ t('verify_change_title') }}{% endblock %}

{% block content %}
<section class="bg-gradient-to-b from-mist-100 to-white">
<div class="max-w-md mx-auto px-4 sm:px-6 py-8 sm:py-14">
    <div class="text-center mb-6">
        <img src="{{ logo_url() }}" alt="OG Multiservices" class="h-10 w-auto mx-auto mb-3">
        <h1 class="text-2xl font-extrabold tracking-tight text-brand-800">{{ t('verify_change_title') }}</h1>
        <p class="mt-1.5 text-slate-500 text-sm">{{ t('verify_change_subtitle') }}</p>
    </div>

    <form method="POST" class="bg-white border border-slate-100 shadow-card rounded-panel p-5 sm:p-6 space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next or '' }}">
        <div>
            <label for="change-email" class="block text-sm font-semibold text-brand-800 mb-1.5">{{ t('verify_change_new_email') }}</label>
            <input id="change-email" type="email" name="email" required autofocus autocomplete="email"
                   value="{{ current_email }}"
                   class="w-full min-h-[48px] rounded-xl border border-slate-200 px-3.5 text-base focus:outline-none focus:ring-2 focus:ring-accent-500">
        </div>
        <button type="submit" class="w-full min-h-[52px] rounded-xl bg-accent-600 text-white font-semibold hover:bg-accent-700 transition shadow-sm shadow-accent-600/25">
            {{ t('verify_change_cta') }}
        </button>
    </form>

    <p class="mt-5 text-center text-sm text-slate-500">
        <a href="{{ url_for('account.verify_email', lang=lang, next=next) }}" class="font-semibold text-accent-700 hover:text-accent-600">{{ t('verify_change_back') }}</a>
    </p>
</div>
</section>
{% endblock %}
